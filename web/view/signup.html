<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project SOMA 회원가입</title>
  <style>
    :root { font-family: Pretendard, "Noto Sans KR", sans-serif; color: #1f2937; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f6; }
    main { width: min(390px, calc(100% - 32px)); padding: 32px; background: white;
           border-radius: 14px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .hint { margin: 0 0 24px; color: #64748b; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #cbd5e1;
            border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px;
             background: #059669; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #message { min-height: 40px; margin: 14px 0 0; font-size: 14px; color: #b91c1c; }
    #message.success { color: #047857; }
    .login { margin-top: 18px; text-align: center; font-size: 14px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>회원가입</h1>
    <p class="hint">Supabase Auth 계정을 생성합니다.</p>
    <form id="signupForm" novalidate>
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirmation">비밀번호 확인</label>
      <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="8" required>
      <button id="signupButton" type="submit">회원가입</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="login">이미 계정이 있나요? <a href="./login.html">로그인</a></p>
  </main>

  <script type="module">
    import { isNetworkError, LOGIN_URL, MAIN_URL, redirectIfAuthenticated, signup } from "./auth.js";

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    try {
      await redirectIfAuthenticated();
    } catch {
      message.textContent = "인증 서비스에 연결할 수 없습니다. 네트워크를 확인해주세요.";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.classList.remove("success");
      message.textContent = "";
      button.disabled = true;
      try {
        const result = await signup(
          form.email.value,
          form.password.value,
          form.confirmation.value,
        );
        message.classList.add("success");
        if (result.confirmationRequired) {
          // 인증 메일 확인은 다른 탭에서 하므로 이 페이지는 결과를 알 수 없습니다.
          // 기다리게 두지 않고 로그인 창으로 보냅니다.
          message.textContent = "회원가입 완료! 메일 인증 후 로그인해주세요. 로그인 화면으로 이동합니다.";
          window.setTimeout(() => window.location.replace(LOGIN_URL), 1500);
        } else {
          message.textContent = "가입과 로그인이 완료되었습니다. 대시보드로 이동합니다.";
          window.setTimeout(() => window.location.replace(MAIN_URL), 600);
        }
      } catch (error) {
        if (error.message?.endsWith("입력해주세요.") ||
            error.message?.includes("8자") || error.message?.includes("일치하지")) {
          message.textContent = error.message;
        } else if (isNetworkError(error)) {
          message.textContent = "네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
        } else {
          message.textContent = "회원가입을 완료할 수 없습니다. 입력값을 확인해주세요.";
        }
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
