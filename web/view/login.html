<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project SOMA 로그인</title>
  <style>
    :root { font-family: Pretendard, "Noto Sans KR", sans-serif; color: #1f2937; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f6; }
    main { width: min(390px, calc(100% - 32px)); padding: 32px; background: white;
           border-radius: 14px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .hint { margin: 0 0 24px; color: #64748b; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 11px 12px; border: 1px solid #cbd5e1;
            border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px;
             background: #059669; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #message { min-height: 40px; margin: 14px 0 0; font-size: 14px; color: #b91c1c; }
    #message.success { color: #047857; }
    .login { margin-top: 18px; text-align: center; font-size: 14px; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>로그인</h1>
    <p class="hint">Supabase Auth 계정으로 로그인합니다.</p>
    <form id="loginForm" novalidate>
      <label for="email">이메일</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="loginButton" type="submit">로그인</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <p class="login">계정이 없나요? <a href="./signup.html">회원가입</a></p>
  </main>

  <script type="module">
    import {
      isEmailNotConfirmed, isInvalidCredentials, isNetworkError,
      login, MAIN_URL, redirectIfAuthenticated,
    } from "./auth.js";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    try {
      await redirectIfAuthenticated();
    } catch {
      message.textContent = "인증 서비스에 연결할 수 없습니다. 네트워크를 확인해주세요.";
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.classList.remove("success");
      message.textContent = "";
      button.disabled = true;
      try {
        await login(form.email.value, form.password.value);
        message.classList.add("success");
        message.textContent = "로그인되었습니다. 대시보드로 이동합니다.";
        window.setTimeout(() => window.location.replace(MAIN_URL), 600);
      } catch (error) {
        if (error.message?.endsWith("입력해주세요.")) {
          message.textContent = error.message;
        } else if (isInvalidCredentials(error)) {
          message.textContent = "아이디 또는 비밀번호가 올바르지 않습니다. 입력한 정보를 다시 확인해 주세요.";
        } else if (isEmailNotConfirmed(error)) {
          message.textContent = "메일 인증이 완료되지 않았습니다. 받은 메일의 인증 링크를 눌러주세요.";
        } else if (isNetworkError(error)) {
          message.textContent = "네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
        } else {
          message.textContent = "로그인할 수 없습니다. 잠시 후 다시 시도해주세요.";
        }
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
